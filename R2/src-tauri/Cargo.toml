[package]
name = "cepillado-embrujado"
version = "1.0.0"
description = "El Cepillado Embrujado - HealthySmile Lab"
authors = ["Jesús Zamora Jiménez"]
edition = "2021"

[lib]
name = "cepillado_embrujado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
